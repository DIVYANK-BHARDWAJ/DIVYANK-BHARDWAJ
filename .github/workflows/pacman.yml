name: Generate profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  graphics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate GitHub statistics card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/generate_stats.py
          mkdir -p dist
          cp github-stats.svg dist/github-stats-v2.svg

      - name: Publish profile graphics
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_dir_non_empty: true
          jekyll: false
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
