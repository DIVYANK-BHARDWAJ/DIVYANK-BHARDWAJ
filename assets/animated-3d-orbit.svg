<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" fill="none">
  <defs>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(260 137) rotate(90) scale(120 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5C58FF" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#2D73FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0B1019" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="207" y1="68" x2="315" y2="197" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDFF"/>
      <stop offset=".2" stop-color="#8BE8FF"/>
      <stop offset=".48" stop-color="#617CFF"/>
      <stop offset=".72" stop-color="#B19AFF"/>
      <stop offset="1" stop-color="#393A88"/>
    </linearGradient>
    <linearGradient id="sideA" x1="210" y1="100" x2="259" y2="171" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CEBFF"/>
      <stop offset="1" stop-color="#4B65D9"/>
    </linearGradient>
    <linearGradient id="sideB" x1="259" y1="100" x2="315" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9A8DFF"/>
      <stop offset="1" stop-color="#4C3B9F"/>
    </linearGradient>
    <linearGradient id="orbit" x1="158" y1="80" x2="363" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EF0FF"/>
      <stop offset=".48" stop-color="#6485FF"/>
      <stop offset="1" stop-color="#D1A2FF"/>
    </linearGradient>
    <linearGradient id="platform" x1="190" y1="210" x2="330" y2="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14263B"/>
      <stop offset=".5" stop-color="#29486B"/>
      <stop offset="1" stop-color="#151A31"/>
    </linearGradient>
    <filter id="glow" x="100" y="0" width="320" height="290" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shine" x="178" y="47" width="164" height="173" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="520" height="300" rx="12" fill="url(#aura)"/>
  <ellipse cx="260" cy="145" rx="112" ry="96" fill="#5C73FF" fill-opacity=".22" filter="url(#glow)"/>

  <!-- quiet technical grid -->
  <g stroke="#47688B" stroke-width="1" opacity=".42">
    <path d="M72 77h44M94 55v44M407 70h42M428 49v42M78 219h48M102 195v48M394 220h47M418 197v46"/>
    <path d="M130 118h27M143.5 104.5v27M365 115h27M378.5 101.5v27" stroke-dasharray="2 4"/>
    <circle cx="139" cy="161" r="2" fill="#78E9FF" stroke="none"/>
    <circle cx="385" cy="157" r="2" fill="#B69AFF" stroke="none"/>
    <circle cx="345" cy="56" r="2" fill="#A8B5FF" stroke="none"/>
  </g>

  <!-- floating shards with independent motion -->
  <g>
    <path d="M160 104 176 95 190 104 186 122 168 123 160 104Z" fill="#162A4A" stroke="#6FE5FF" stroke-opacity=".9">
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 -5; 0 5" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <path d="M168 108h14M175 101v14" stroke="#A1F2FF" stroke-width="1.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 -5; 0 5" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <path d="M337 97 353 88 369 98 364 116 346 118 337 97Z" fill="#241A45" stroke="#B59AFF" stroke-opacity=".9">
      <animateTransform attributeName="transform" type="translate" values="0 -4; 0 5; 0 -4" dur="5.4s" repeatCount="indefinite"/>
    </path>
    <path d="M347 103h13" stroke="#D5C6FF" stroke-width="1.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 -4; 0 5; 0 -4" dur="5.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- projected shadow and levitating plinth -->
  <ellipse cx="260" cy="254" rx="90" ry="13" fill="#03070D" fill-opacity=".72"/>
  <ellipse cx="260" cy="249" rx="58" ry="7" fill="#477DFF" fill-opacity=".25"/>
  <path d="M184 218 209 195H311L336 218 319 242H201L184 218Z" fill="url(#platform)" stroke="#6A9AC6" stroke-opacity=".85" stroke-width="1.3"/>
  <path d="M209 195H311L321 205H199L209 195Z" fill="#456A94" fill-opacity=".6" stroke="#90D6FF" stroke-opacity=".55"/>
  <path d="M206 220h108M216 230h88" stroke="#8CB6DE" stroke-opacity=".6" stroke-width="1.2"/>

  <!-- three-dimensional orbital rings -->
  <g>
    <ellipse cx="260" cy="137" rx="78" ry="103" stroke="url(#orbit)" stroke-width="2.2" transform="rotate(28 260 137)">
      <animateTransform attributeName="transform" type="rotate" values="28 260 137; -12 260 137; 28 260 137" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="260" cy="137" rx="111" ry="49" stroke="url(#orbit)" stroke-width="2.1" transform="rotate(-25 260 137)">
      <animateTransform attributeName="transform" type="rotate" values="-25 260 137; 14 260 137; -25 260 137" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="260" cy="137" rx="95" ry="31" stroke="#7DDFFF" stroke-opacity=".72" stroke-width="1.1" transform="rotate(61 260 137)">
      <animateTransform attributeName="transform" type="rotate" values="61 260 137; 101 260 137; 61 260 137" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- glow behind the levitating prism -->
  <path d="M260 65 309 94 323 145 292 190 236 190 198 151 207 99 260 65Z" fill="#7B72FF" fill-opacity=".55" filter="url(#shine)">
    <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- faceted chrome mask / abstract 3D core -->
  <g>
    <path d="M260 66 302 91 314 137 288 174 246 179 210 151 215 105 260 66Z" fill="url(#chrome)" stroke="#E5FBFF" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M260 66 260 112 302 91M260 112 314 137M260 112 288 174M260 112 246 179M260 112 210 151M260 112 215 105" stroke="#F1FDFF" stroke-opacity=".58" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M260 66 215 105 260 112 302 91 260 66Z" fill="#B4F2FF" fill-opacity=".52">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M228 124 239 116 248 126 243 139 232 139 228 124Z" fill="#0B1428" stroke="#E5FAFF" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M270 126 280 116 291 124 287 139 276 139 270 126Z" fill="#0B1428" stroke="#E5FAFF" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M248 154 260 160 273 154" stroke="#E9FCFF" stroke-width="1.7" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 3; 0 -6; 0 3" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- orbiting energy nodes -->
  <g>
    <circle cx="184" cy="159" r="4" fill="#9CF4FF">
      <animate attributeName="opacity" values=".4;1;.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="76" r="3" fill="#C4A8FF">
      <animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="348" cy="171" r="5" fill="#201B45" stroke="#C1A6FF"/>
    <path d="m345 171 2 2 4-5" stroke="#E4D6FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="174" cy="190" r="3" fill="#73DFFF">
      <animate attributeName="cy" values="190;183;190" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>