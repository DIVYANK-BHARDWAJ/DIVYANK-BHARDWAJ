<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Divyank Bhardwaj — interactive engineering terminal." />
  <title>Divyank — Terminal</title>
  <link rel="stylesheet" href="./style.css?v=20260915-3" />
  <style>
    /* Botpress is the AI transport; the terminal is the only visible UI. */
    .bpWebchat,
    .bpFab,
    [class*="bpWebchat"],
    [class*="bpFab"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <main class="terminal-shell">
    <header class="terminal-bar">
      <div class="traffic"><span></span><span></span><span></span></div>
      <div class="title">divyank@github: ~</div>
      <div class="status" id="status">AI LOADING</div>
    </header>
    <section id="output" class="output" aria-live="polite"></section>
    <form id="terminal-form" class="prompt-row" autocomplete="off">
      <span class="prompt">divyank@github:~$</span>
      <input id="command" aria-label="Terminal command" autofocus spellcheck="false" />
    </form>
  </main>

  <!-- Official Botpress-generated Webchat embed. Botpress provides the AI
       transport while the portfolio terminal remains the user interface. -->
  <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/09/14/19/20260914190719-XPY8Q3UH.js" defer></script>
  <script src="./script.js?v=20260915-3"></script>
</body>
</html>
